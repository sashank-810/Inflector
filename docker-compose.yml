services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inflector}
      POSTGRES_USER: ${POSTGRES_USER:-inflector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inflector}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inflector_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inflector_postgres_data:

