[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inflector"
version = "0.1.0"
description = "Indian Equity Intelligence and Early Opportunity Detection System"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "pyright>=1.1.390,<2",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages/core", "packages/database"]
include = ["inflector_api*", "inflector_core*", "inflector_database*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["apps/api", "packages/core", "packages/database"]

[tool.pyright]
include = ["apps/api", "packages/core", "packages/database", "tests"]
extraPaths = ["apps/api", "packages/core", "packages/database"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "packages/core", "packages/database", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
